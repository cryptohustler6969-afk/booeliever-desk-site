<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Booeliever Desk</title>
<meta name="theme-color" content="#0a0c24">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/favicon-64.png" type="image/png" sizes="64x64">
<link rel="icon" href="icons/icon-192.png" type="image/png" sizes="192x192">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Booeliever">
<style>
  @font-face{font-family:"Cinzel";src:url("fonts/cinzel-var-latin.woff2") format("woff2");font-weight:400 900;font-display:swap}
  @font-face{font-family:"Inter";src:url("fonts/inter-var-latin.woff2") format("woff2");font-weight:100 900;font-display:swap}
  html,body{margin:0;min-height:100%;color:#eef0ff;font:15px/1.5 "Inter",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:#0a0c24}
  .lock{position:relative;min-height:100vh;display:grid;place-items:center;padding:24px;box-sizing:border-box;overflow:hidden;
    background:radial-gradient(70vmax 50vmax at 50% -10%,rgba(157,176,255,.30),rgba(107,140,255,.08) 45%,transparent 70%),linear-gradient(180deg,#0a0c24,#140f40 55%,#1b1150)}
  .lock::before{content:"";position:absolute;left:50%;top:-20vh;width:160vmax;height:160vmax;transform:translateX(-50%);opacity:.2;pointer-events:none;
    background:repeating-conic-gradient(from 160deg at 50% 0%,rgba(190,205,255,.6) 0deg 1.2deg,transparent 1.2deg 7deg);
    -webkit-mask:radial-gradient(closest-side at 50% 0%,#000,transparent 55%);mask:radial-gradient(closest-side at 50% 0%,#000,transparent 55%)}
  .lock::after{content:"";position:absolute;inset:0;pointer-events:none;opacity:.5;background-size:480px 480px;
    background-image:radial-gradient(1px 1px at 12% 18%,#fff 50%,transparent 51%),radial-gradient(1px 1px at 70% 10%,#dfe5ff 50%,transparent 51%),radial-gradient(1.5px 1.5px at 84% 34%,#c9b8ff 50%,transparent 51%),radial-gradient(1px 1px at 30% 60%,#fff 50%,transparent 51%),radial-gradient(1px 1px at 58% 82%,#dfe5ff 50%,transparent 51%),radial-gradient(1.5px 1.5px at 8% 88%,#b9c6ff 50%,transparent 51%)}
  .box{position:relative;z-index:1;width:100%;max-width:370px;background:linear-gradient(180deg,rgba(34,32,92,.62),rgba(18,16,58,.62));border:1px solid rgba(157,176,255,.22);border-radius:22px;padding:30px 24px 26px;box-sizing:border-box;text-align:center;
    backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);box-shadow:0 20px 70px rgba(5,4,25,.6),0 0 40px rgba(107,140,255,.15)}
  .box img.logo{display:block;margin:0 auto;border-radius:26px;box-shadow:0 0 0 1px rgba(157,176,255,.25),0 0 40px rgba(107,140,255,.45),0 0 70px rgba(155,92,255,.25)}
  h1{font-family:"Cinzel",Georgia,serif;font-weight:700;letter-spacing:2px;font-size:22px;margin:16px 0 2px}
  .tag{font-family:"Cinzel",Georgia,serif;color:#9db0ff;letter-spacing:1.5px;font-size:13px;margin:0 0 6px;text-shadow:0 0 14px rgba(107,140,255,.5)}
  p{color:#a3a8d6;margin:0 0 18px;font-size:13px}
  .owner{display:flex;align-items:center;justify-content:center;gap:9px;margin:10px 0 14px;font-size:13px;font-weight:600;color:#f6e7c1}
  .owner img{border-radius:50%;object-fit:cover;box-shadow:0 0 0 1.5px #f2c46d,0 0 12px rgba(242,196,109,.35)}
  .fan{margin-top:14px;font-size:11px;color:#7076a8}
  input[type=password]{width:100%;box-sizing:border-box;background:rgba(10,12,36,.75);color:#eef0ff;border:1px solid rgba(157,176,255,.3);border-radius:12px;padding:12px 14px;font:inherit;outline:none;transition:.2s}
  input[type=password]:focus{border-color:#9db0ff;box-shadow:0 0 0 3px rgba(107,140,255,.2),0 0 18px rgba(107,140,255,.3)}
  label{display:flex;gap:8px;align-items:center;justify-content:flex-start;color:#a3a8d6;font-size:13px;margin:12px 2px}
  input[type=checkbox]{accent-color:#6b8cff}
  button{width:100%;background:linear-gradient(90deg,#6b8cff,#9b5cff);color:#fff;border:0;border-radius:12px;padding:12px;font:inherit;font-weight:650;letter-spacing:.5px;cursor:pointer;box-shadow:0 8px 24px rgba(107,140,255,.35)}
  button:disabled{opacity:.6;cursor:wait} .err{color:#ff7a93;font-size:13px;min-height:18px;margin-top:10px}
  .lock.turn{animation:turn .45s ease-in forwards}
  @keyframes turn{to{opacity:0;transform:perspective(1400px) rotateY(12deg) translateX(14px)}}
  @media (prefers-reduced-motion:reduce){.lock.turn{animation:none}}
</style>
</head>
<body>
<div class="lock" id="lock">
  <form class="box" id="lock-form" autocomplete="on">
    <img src="icons/logo-256.png" alt="Booeliever logo" width="112" height="112" class="logo">
    <h1>Booeliever Desk</h1>
    <div class="tag">And so it begins… 📜🐸</div>
    <div class="owner"><img src="icons/pfp-160.png" alt="" width="30" height="30">CryptoHustler6969 · trading bot</div>
    <p>Private. Enter the password to unlock.</p>
    <input type="text" name="username" value="booeliever" autocomplete="username" hidden>
    <input type="password" id="pw" autocomplete="current-password" placeholder="Password" required autofocus>
    <label><input type="checkbox" id="remember"> Remember on this device</label>
    <button id="unlock" type="submit">Unlock</button>
    <div class="err" id="err" role="alert"></div>
    <div class="fan">Fan-made Book of Ethereum theme · not affiliated with BOOE</div>
  </form>
</div>
<script src="loader.js"></script>
</body>
</html>
