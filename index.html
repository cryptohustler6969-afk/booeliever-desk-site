<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Booeliever Desk</title>
<meta name="theme-color" content="#07090f">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Booeliever">
<style>
  html,body{margin:0;min-height:100%;background:#07090f;color:#e8edf5;font:15px/1.45 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  .lock{min-height:100vh;display:grid;place-items:center;padding:24px;box-sizing:border-box;background:radial-gradient(900px 500px at 20% -10%,rgba(91,140,255,.12),transparent 60%),#07090f}
  .box{width:100%;max-width:360px;background:#10151f;border:1px solid #1f2836;border-radius:18px;padding:28px 24px;box-sizing:border-box;text-align:center}
  .box img{border-radius:14px} h1{font-size:20px;margin:12px 0 4px} p{color:#8592a6;margin:0 0 18px;font-size:13px}
  input[type=password]{width:100%;box-sizing:border-box;background:#07090f;color:#e8edf5;border:1px solid #2a3546;border-radius:12px;padding:12px 14px;font:inherit;outline:none}
  input[type=password]:focus{border-color:#5b8cff}
  label{display:flex;gap:8px;align-items:center;justify-content:flex-start;color:#8592a6;font-size:13px;margin:12px 2px}
  button{width:100%;background:linear-gradient(90deg,#5b8cff,#9b7bff);color:#fff;border:0;border-radius:12px;padding:12px;font:inherit;font-weight:650;cursor:pointer}
  button:disabled{opacity:.6;cursor:wait} .err{color:#ff5d73;font-size:13px;min-height:18px;margin-top:10px}
</style>
</head>
<body>
<div class="lock" id="lock">
  <form class="box" id="lock-form" autocomplete="on">
    <img src="icons/icon-192.png" alt="" width="56" height="56">
    <h1>Booeliever Desk</h1>
    <p>Private. Enter the password to unlock.</p>
    <input type="text" name="username" value="booeliever" autocomplete="username" hidden>
    <input type="password" id="pw" autocomplete="current-password" placeholder="Password" required autofocus>
    <label><input type="checkbox" id="remember"> Remember on this device</label>
    <button id="unlock" type="submit">Unlock</button>
    <div class="err" id="err" role="alert"></div>
  </form>
</div>
<script src="loader.js"></script>
</body>
</html>
